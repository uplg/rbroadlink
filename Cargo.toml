[package]
name = "rbroadlink"
version = "0.4.2"
edition = "2021"
license = "MIT"
description = "A library to control broadlink smart devices."
homepage = "https://github.com/nicholascioli/rbroadlink"
repository = "https://github.com/nicholascioli/rbroadlink"
readme = "README.md"
authors = [
    "Nicholas Cioli <nicholascioli@users.noreply.github.com>",
    "Wyatt Lindquist <git.wquist@gmail.com>",
]

[lib]
name = "rbroadlink"
path = "src/lib.rs"

[[example]]
name = "rbroadlink-cli"
required-features = ["rbroadlink-cli"]

[[example]]
name = "mqtt-broadlink"
required-features = ["mqtt-broadlink"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
jiff = "1.0.2"
if-addrs = "0.15.0"
hex-literal = "1.1.0"
packed_struct = "0.12.0"
phf = { version = "0.14.0", features = ["macros"] }
rand = "0.10.4"

# Dependencies for the examples
env_logger = { version = "0.11.12", optional = true }
log = { version = "0.4.35", optional = true }
rumqttc = { version = "0.25.1", features = ["url"], optional = true }
rpassword = { version = "7.5.5", optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }

[dev-dependencies]
clap = { version = "4.6.9", features = ["derive"] }
hex = { version = "0.4.3" }

[features]
rbroadlink-cli = ["rpassword"]
mqtt-broadlink = ["env_logger", "log", "rumqttc", "tokio"]

[lints.cargo]
# The examples' optional dependencies are used by the examples alone, behind their features.
unused_dependencies = "allow"
